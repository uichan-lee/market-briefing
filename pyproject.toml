[project]
name = "market-briefing"
version = "0.1.0"
description = "Daily market briefing pipeline for Korean and US equities. Read-only; does not execute trades."
requires-python = ">=3.11"

# Dependencies are added as the code that needs them is written, not up front.
# SPEC §3 names further sources (pykrx, dart-fss, python-kis, fredapi, yfinance,
# sentence-transformers, litellm); each is added alongside its own collector or
# stage, with a stated reason, per CLAUDE.md "ask before adding a dependency".
dependencies = [
    # Pinned below 3.0 deliberately, not by accident. pykrx — the KRX data
    # source SPEC §3.1 specifies, and the origin of foreign_flow_5d, the
    # project's most differentiated feature — caps pandas at <3.0. Resolving
    # against pandas 3 silently backsolves to pykrx 1.0.51, a version old
    # enough that it fails to import on Python 3.13 and whose scraping logic
    # predates the current KRX site by years.
    #
    # For a library whose entire job is scraping a site that changes, being
    # maintained matters more than the pandas major version. Other Korean
    # finance libraries still to be added (dart-fss, python-kis) are likely to
    # carry the same cap, so this pin is expected to hold for a while.
    #
    # The cost is visible in tests/test_validate.py: pandas 2 types a text
    # column as `object`, pandas 3 as `str`. Revisit when pykrx supports
    # pandas 3, and expect that schema convention to flip back.
    "pandas>=2.2,<3.0",
    # CLAUDE.md mandates market-session logic come from a calendar library,
    # never hardcoded holidays or DST transitions.
    "pandas-market-calendars>=4.4",
    # SPEC §3.1: KR OHLCV, net buying by investor type, short-interest balance,
    # market cap/PER/PBR. No credential — it scrapes KRX. Sleep between calls.
    # SPEC §3.3 specifies .parquet for every raw price/flow path. pandas has no
    # parquet engine of its own, and none was installed — writing the backfill
    # would have failed at the first save. pyarrow is the engine pandas
    # documents first and the one that reads the nullable Int64 columns kr_flow
    # produces without silently widening them to float.
    "pyarrow>=16",
    # SPEC §7.1's vendor-neutral layer, imported only by src/llm/adapter.py per
    # CLAUDE.md rule 4. One dependency instead of three vendor SDKs, chosen for
    # the part that actually differs between them: the §7.4 bake-off needs the
    # same JSON schema enforced on Anthropic, OpenAI and Gemini, and each
    # expresses structured output differently. litellm transforms one
    # `response_format` into each vendor's own form, so the schema is written
    # once and the comparison measures the models rather than three hand-rolled
    # request builders. SPEC §7.1 names it as one of the two acceptable shapes.
    "litellm>=1.55",
    "pykrx>=1.2.8",
    "pyyaml>=6.0",
    # Not a new dependency — kr_news and us_price already import it. It was
    # arriving transitively through pykrx, which means a pykrx release that
    # switched HTTP clients would break both collectors with an ImportError and
    # no indication why. Declared so the lockfile pins it on its own terms.
    "requests>=2.31",
    # SPEC §6.1 Stage 1's local embedding runtime, for step 6 (dedup +
    # relevance filtering) — SPEC §3 names it, and CLAUDE.md's determinism-first
    # principle is why this stage runs on embeddings rather than an LLM call:
    # zero cost, and 100% reproducible where an LLM is not even at
    # temperature=0. Decided 2026-08-12 by Ricky, after Claude laid out the
    # tradeoff (model size, install footprint, the settled alternative of
    # calling an LLM instead, which SPEC's v0.2 redesign already rejected on
    # cost and reproducibility grounds).
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# sentence-transformers pulls in torch, whose default PyPI build bundles CUDA
# and runs ~5.5GB installed. Nothing in this project has a GPU — collectors run
# on Ricky's Mac and GitHub Actions' ubuntu-latest runners, neither of which
# has one — so the CUDA build buys nothing and costs bandwidth and disk on
# every `uv sync`, including in CI on every report run. Pinned to PyTorch's own
# CPU-only wheel index instead, per uv's documented pattern
# (docs.astral.sh/uv/guides/integration/pytorch), which brings the install down
# to roughly 1-1.5GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# SPEC §10 lays out a flat `src/` with subpackages rather than `src/<package>/`.
# This project is an application run by CI, never a pip-installed library, so
# imports resolve as `from src.util.session import ...` via the repo root.
pythonpath = ["."]
# --strict-markers turns a typo'd or unregistered marker into an error instead of
# a warning. That matters here because CLAUDE.md requires `pytest -m "not network"`
# as the default run: a silently-unregistered `network` marker would mean
# network tests quietly run in CI.
addopts = "--strict-markers"
markers = [
    "network: test performs a live network call; excluded from the default run",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately compare against hardcoded expected values.
"tests/*" = ["E501"]
