# Korean news collection. SPEC §1, §3.1.
name: collect-news

# This schedule is a correctness requirement, not a freshness preference. RSS
# serves a rolling 50–120 item buffer with no history, so anything published
# between two runs and pushed out of the buffer before the second is gone
# permanently.
#
# Frequency is not uniform, because buffer *span* is not uniform. A buffer is
#    a fixed item count, so it holds less time the faster the outlet publishes.
#    Measured at 22:30 KST, 한국경제 경제 held 4.0 hours and 인포스탁 held 101.6.
#    During the Korean session the fast feeds hold far less, which is where a
#    single skipped run starts costing articles — so the session is polled twice
#    an hour and the rest of the day once.
#
# Cloudflare Workers owns the 31-run schedule and calls this workflow through
# workflow_dispatch. GitHub's best-effort cron dropped runs often enough to lose
# RSS history; see infra/cloudflare-scheduler/ for the tracked trigger times.
on:
  workflow_dispatch:

permissions:
  contents: write

# A slow run must not overlap the next one — two jobs pushing to the same branch
# race, and the loser's articles are lost with no way to re-fetch them.
# cancel-in-progress stays false for the same reason: a run already holding
# articles has to be allowed to finish writing them.
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Collect
        run: uv run python -m src.collectors.kr_news

      # `always()`, matching report.yml, and here it is load-bearing rather than
      # tidy. The collector exits non-zero on a failed check even when it stored
      # articles — a timed-out feed means unmeasured, unrecoverable loss and has
      # to raise the alarm. Without this line that alarm would skip the commit
      # and destroy the very articles it is warning about.
      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/kr/news
          if git diff --cached --quiet; then
            echo "no new articles this hour"
            exit 0
          fi

          git commit -m "data: kr_news $(date -u +'%Y-%m-%dT%H:%MZ')"

          # The report workflow commits too, so rebase before pushing. Retry
          # rather than fail: a lost push means lost articles.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1
