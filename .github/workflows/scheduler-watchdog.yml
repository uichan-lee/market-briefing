name: scheduler-watchdog

on:
  workflow_dispatch:
    inputs:
      reason:
        description: concise scheduler or freshness failure reason
        required: true
        type: string
      details:
        description: structured watchdog evidence, without credentials
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      BRIEFING_EMAIL_TO: ${{ secrets.BRIEFING_EMAIL_TO }}
      SCHEDULER_REASON: ${{ inputs.reason }}
      SCHEDULER_DETAILS: ${{ inputs.details }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-suffix: notify-runtime-v1
          prune-cache: false
      - name: Prepare notification runtime
        timeout-minutes: 3
        run: uv sync --locked --only-group notify
      - name: Email scheduler alert
        run: |
          uv run --no-sync python - <<'PY'
          import datetime as dt
          import os

          from src.notify.base import deliver, delivery_exit_code
          from src.util.config import load_delivery

          reason = os.environ["SCHEDULER_REASON"]
          notice = f"# ⚠ 스케줄러 경고\n\n{reason}\n"
          details = os.environ.get("SCHEDULER_DETAILS", "").strip()
          if details:
              notice += f"\n## 판단 근거\n\n{details[:4000]}\n"
          channels = [item for item in load_delivery()["channels"] if item["type"] == "email"]
          results = deliver(notice, channels, day=dt.date.today(), label="SCHEDULER")
          for result in results:
              print(result)
          raise SystemExit(delivery_exit_code(results))
          PY
