# The two daily report runs. SPEC §1, §12 step 11.
name: report

# Cloudflare Workers owns the wall-clock schedule. GitHub's best-effort cron
# repeatedly delayed or dropped both runs; infra/cloudflare-scheduler/ is the
# versioned caller and records the UTC trigger times.
on:
  workflow_dispatch:
    inputs:
      run:
        description: which run to execute
        type: choice
        options: [morning, evening]
        required: true

permissions:
  contents: write

# Serialized with itself; the news workflow runs under its own group, so the
# only cross-workflow race is the push, handled by the rebase-retry loop below.
concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Not a secret in the credential sense — a personal inbox kept out of a
      # public tracked file. config/delivery.yaml names it via `to_env`, and an
      # unset value fails at channel-build time rather than delivering nowhere.
      BRIEFING_EMAIL_TO: ${{ secrets.BRIEFING_EMAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # setup-uv's cache above is the Python *package* cache — it does not
      # touch model weights. SPEC §6.1's embedding stage (step 6, not yet
      # wired into this run as of 2026-08-12) downloads `BAAI/bge-m3` on first
      # use, 2.27GB, into huggingface_hub's default cache dir. A fresh runner
      # checks out clean every time, so without this the model would be
      # re-downloaded on every single report run rather than once. Keyed on
      # the model name so a future model change (a new SPEC §6.1 choice) gets
      # its own cache entry instead of silently reusing a stale one.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-m3

      # Matching the evening cron rather than the morning ones: morning has
      # three lines and will grow more, and every added line would otherwise
      # need a matching branch here to avoid silently running as evening.
      - name: Determine run
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ inputs.run }}" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_dispatch input is required" >&2
            exit 1
          fi

      # What makes the duplicate morning crons free. The renderer writes
      # `reports/<resolved KR session>-<run>.md`, so an existing file means a
      # briefing for that session already went out and this firing has nothing
      # to add.
      #
      # Read from the remote, not the working tree, and this is the whole
      # subtlety: `actions/checkout` fetches the commit the run was *created*
      # at, so a firing delayed by three hours checks out a tree from before the
      # backstop pushed anything and would find no file, exactly when the guard
      # matters most. `git cat-file` against a freshly fetched FETCH_HEAD asks
      # what is on the branch now.
      #
      # A run that failed leaves no report file, so a genuine failure is still
      # retried by the next firing rather than suppressed. workflow_dispatch is
      # never skipped: a manual re-render has to be able to replace a bad one.
      #
      # Scoped to the morning run, and that scope is load-bearing. The evening
      # run has no backstop to deduplicate, so the guard could only ever cost it
      # something — and nearly did: the file name carries the *reading* date, so
      # the late evening run of 2026-08-06 rendered after midnight KST and left
      # a `2026-08-07-evening.md` behind. A guard covering evening would have
      # read that stale file and suppressed the real 2026-08-07 evening
      # briefing. Caught by running this shell against the live remote before
      # the workflow ever shipped.
      - name: Already published
        id: published
        run: |
          set -euo pipefail

          echo "manual dispatches intentionally re-render; Cloudflare emits one run per slot"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Collect
        if: steps.published.outputs.skip != 'true'
        run: uv run python -m scripts.collect_daily --run "${{ steps.which.outputs.run }}"

      - name: Render and deliver
        if: steps.published.outputs.skip != 'true'
        run: uv run python -m src.report.render --run "${{ steps.which.outputs.run }}"

      # Backstop for the case render's own failure notice cannot cover: the
      # step above dying before Python starts (sync failure, OOM). CLAUDE.md:
      # a run that produces no report sends a failure notice, never nothing.
      #
      # `cancelled()` alongside `failure()` since 2026-08-13: `timeout-minutes:
      # 30` cancels rather than fails the job, and `if: failure()` alone never
      # fires on a cancellation — a run that overran its budget (a cold
      # dependency sync, say) published nothing and mailed nothing. Both are
      # "no report went out" from CLAUDE.md's point of view.
      - name: Failure notice
        if: failure() || cancelled()
        run: |
          uv run python - <<'EOF' || true
          import datetime as dt
          from src.notify.base import deliver
          from src.report.render import _failure_notice
          from src.util.config import load_delivery
          from src.util.session import now_utc, to_kst

          run = "${{ steps.which.outputs.run }}" or "unknown"
          today = to_kst(now_utc()).date()
          notice = _failure_notice(run, today, "workflow step failed before the renderer could report")
          for result in deliver(notice, load_delivery().get("channels", []), day=today, label="FAILED"):
              print(result)
          EOF

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/ratings data/scores reports
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi

          git commit -m "data: ${{ steps.which.outputs.run }} run $(date -u +'%Y-%m-%dT%H:%MZ')"

          # collect-news pushes to the same branch; same rebase-retry loop.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1
