# Directional rating. SPEC §2.2⑥.
#
# The briefing states an opinion — 강한 매수 through 강한 매도 — and this file is
# where that opinion is defined. It is computed, not written: a weighted sum of
# z-scores, bucketed by the cut points below. No LLM is involved in producing
# the rating or its rationale.
#
# ─────────────────────────────────────────────────────────────────────────────
# THESE NUMBERS ARE STARTING VALUES, NOT MEASURED ONES.
#
# Nobody has calibrated them — no data has been collected yet. Calibrating them
# is MANUAL-TASKS.md §6, and it is Ricky's call.
#
# The one way to do it wrong: adjusting weights or cut points because the
# ratings they produce look agreeable. That is fitting the dial to the answer.
# PREREGISTRATION.md §8.4 permits revising cut points for distributional
# reasons — if nearly everything lands in 관망 the scale is useless — but never
# against outcome data, and every change gets logged in PREREGISTRATION §R.
# ─────────────────────────────────────────────────────────────────────────────

# Every input is already a 252-trading-day rolling z-score (SPEC §5), so the
# weights below are comparable to each other and the composite is itself in
# roughly z units. Signs are deliberate: `short_ratio` rising is bearish.
# Only features src/features/compute.py actually produces belong here. Every
# name below is in its FEATURES tuple; a name that is not lands in
# `deferred_weights` instead, and tests/test_config.py holds the two apart.
weights:                     # sums to 0.75
  foreign_flow_5d: 0.30      # SPEC §3.1 calls this the most differentiated KR feature
  inst_flow_5d: 0.15
  rel_strength_20d: 0.15
  short_ratio: -0.10
  valuation_band: 0.05       # 3-year PBR percentile, low = cheap = positive

# Designed weight for features that have no producer yet. Read by the report
# header so the briefing keeps naming what is absent; never read by rate().
#
# This key exists because listing them above was actively harmful, not merely
# useless: rate() computes `score = raw ÷ coverage`, so 0.35 of weight that
# never arrives inflated every score by 1.47× and left the 0.5 coverage floor
# 18 points of margin instead of 50 — enough that losing one more feature
# forced 관망 by arithmetic rather than by evidence. Measured against
# 2026-08-07: moving these two changed 8 of 31 published ratings and cleared
# all five tickers that the floor had been forcing to 관망. PREREGISTRATION §R,
# 2026-08-08.
#
# When a producer arrives, move the name up and rebalance the actives rather
# than adding on top — weights are relative shares, so appending silently
# rescales what every existing weight means.
deferred_weights:            # sums to 0.20
  news_polarity: 0.20        # aggregated per SPEC §6.2 — the LLM stage, SPEC §12 steps 6–8

  # `rev_4w` (4-week consensus EPS change, weight 0.15) was permanently
  # dropped here 2026-08-25, not deferred: notes/rev4w-vendor-research.md
  # found no source that is both free and ToS-clean, and the one academic
  # path (WRDS/FactSet/Capital IQ Pro) closed 2026-08-21 — Haas library:
  # bulk download not permitted, post-graduation retention not permitted
  # either. Decision recorded in MANUAL-TASKS.md §11. rate() never read this
  # key (deferred_weights is display-only, read by render.py's header), so
  # removing the line is a documentation-only change — it does not alter any
  # computed rating.

  # --- medium-term features (SPEC §5, added v0.5) -----------------------------
  # Left commented rather than listed above, and the distinction is deliberate:
  # these were never activated, so unlike the two names above they have never
  # distorted a published rating. Listing them would make the header name five
  # absent features and restate the design total as 1.35, which is a separate
  # decision from the defect this key was added to fix.
  #
  # rel_strength_120d: 0.10    # 120-day return − sector, the slow companion to rel_strength_20d
  # flow_persistence_60d: 0.10 # 60-day cumulative foreign net buying ÷ trading value
  # rev_trend_12w: 0.05        # 12-week consensus EPS change
  #
  # Macro and industry regime indicators (SPEC §2.2⑨) deliberately do NOT belong
  # in either mapping. They are common to every ticker, so they cancel in the
  # sector-excess return that PREREGISTRATION §8.4 evaluates against — they could
  # add variance to this composite but never IC. They are their own section.

# Cut points on the composite score. Symmetric by construction — an asymmetric
# scale bakes in a directional prior, and any such prior belongs in the weights
# where it is visible, not hidden in the thresholds.
cut_points:
  strong: 2.0                # |score| ≥ 2.0  → 강한 매수 / 강한 매도
  moderate: 1.0              # |score| ≥ 1.0  → 매수 / 매도
  weak: 0.4                  # |score| ≥ 0.4  → 약한 매수 / 약한 매도
                             # otherwise      → 관망

# Guards against a confident-looking rating built on almost nothing.
confidence:
  # Minimum share of total weight that must be present. Below this the ticker is
  # rated 관망 with the missing inputs named, rather than rated off whatever
  # happened to arrive.
  min_weight_coverage: 0.5

  # How many contributors the rationale lists, largest |contribution| first.
  max_rationale_terms: 4
