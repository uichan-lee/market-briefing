# Delivery channels. SPEC §2.0.
#
# CLAUDE.md: never add a delivery channel that is not in this file. Channels are
# pluggable adapters under src/notify/, selected by `type`.

channels:
  # Desktop reading. Actions commits the rendered report to reports/, and the
  # Obsidian Git plugin pulls it into the vault. Wiring: MANUAL-TASKS.md §7.
  - type: vault
    path: reports/
    commit: true

  # Mobile reading. Two different addresses, and conflating them is exactly the
  # mistake MANUAL-TASKS.md §1 warns about:
  #   `to`   — where Ricky reads mail. A personal address is correct here.
  #   `from` — the dedicated account SMTP_PASSWORD authenticates as. Never a
  #            primary address: this credential goes into a GitHub Actions
  #            secret, and a CI secret must not grant access to a personal
  #            mailbox.
  # Neither address is a secret. The password lives in SMTP_PASSWORD, never here.
  - type: email
    to: "rickylee7185@gmail.com"
    from: "marketbriefing.0803@gmail.com" # dedicated account, created 2026-08-03
    smtp_secret: SMTP_PASSWORD
    body: summary # summary | full


  # Generic POST (Slack/Discord/Kakao). SPEC §2.0 specifies it be implemented but
  # left inactive, so it is intentionally absent here rather than disabled — a
  # channel in this file is a channel that sends.
