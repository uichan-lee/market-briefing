# Delivery channels. SPEC §2.0.
#
# CLAUDE.md: never add a delivery channel that is not in this file. Channels are
# pluggable adapters under src/notify/, selected by `type`.

channels:
  # Desktop reading. Actions commits the rendered report to reports/, and the
  # Obsidian Git plugin pulls it into the vault. Wiring: MANUAL-TASKS.md §7.
  - type: vault
    path: reports/
    commit: true

  # Mobile reading. Two different addresses, and conflating them is exactly the
  # mistake MANUAL-TASKS.md §1 warns about:
  #   `to_env` — names the variable holding where Ricky reads mail. A personal
  #              address is correct there, which is why it is not written here:
  #              this repository is public. Neither address is a *secret*, but a
  #              personal inbox is not something a public file should advertise.
  #              A literal `to:` still works for a fork with nothing to hide.
  #   `from`   — the dedicated account SMTP_PASSWORD authenticates as. Never a
  #              primary address: this credential goes into a GitHub Actions
  #              secret, and a CI secret must not grant access to a personal
  #              mailbox. It stays literal because it identifies the sending
  #              account, not a reader.
  # The password lives in SMTP_PASSWORD, never here.
  #
  # BRIEFING_EMAIL_TO must be set in .env *and* in the repository's Actions
  # secrets. An unset value fails at channel-build time with a named error
  # rather than delivering nowhere quietly — src/notify/base.py::_recipient.
  - type: email
    to_env: BRIEFING_EMAIL_TO
    from: "marketbriefing.0803@gmail.com" # dedicated account, created 2026-08-03
    # Host and port are config, not code defaults: a wrong value here is
    # reviewable in a diff, the same assumption buried in the adapter is not.
    host: smtp.gmail.com
    port: 465 # SSL from the first byte; 587/STARTTLS is the other Gmail door
    smtp_secret: SMTP_PASSWORD
    body: summary # summary | full


  # Generic POST (Slack/Discord/Kakao). SPEC §2.0 specifies it be implemented but
  # left inactive, so it is intentionally absent here rather than disabled — a
  # channel in this file is a channel that sends.
