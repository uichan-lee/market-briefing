# Model selection. SPEC §7.1.
#
# CLAUDE.md: no vendor SDK is imported outside src/llm/adapter.py. Swapping a
# provider must be a change to the `provider` string here and nothing else.

embedding:
  provider: local
  model: BAAI/bge-m3          # KR/EN in one model, MIT, runs locally → zero cost

scoring:
  provider: anthropic         # anthropic | openai | google | naver | local
  model: claude-sonnet-5
  temperature: 0
  batch: true
  # NOT YET DECIDED BY BAKE-OFF. This is a placeholder so the pipeline runs, not
  # a choice. SPEC §7.4 requires the decision come from measured golden-set
  # correlation, self-consistency, and cost per valid signal — and MANUAL-TASKS.md
  # §5 makes the call Ricky's, not Claude's. Record the decision and its date
  # here as a comment once the bake-off has run.

# The models the SPEC §7.4 bake-off compares. Read only by src/eval/bakeoff.py,
# never by the pipeline — these are alternatives under test, not the configured
# choice, which is why the runner overrides `scoring` rather than editing it.
#
# Three frontier models first, because §7.4 measures structured-output maturity
# and these are the ones where it is reliable enough that the comparison
# reflects the models rather than three different JSON failure modes. SPEC §7.2
# says not to exclude the Korean models — HyperCLOVA X's tokenizer is cheaper on
# Korean text — and they are the intended fourth candidate, added once this
# harness has been shown to work end to end against a real vendor.
#
# `uv run python -m src.eval.bakeoff run` needs a key per provider. See
# API-KEYS.md §8.
# ⚠ Measured 2026-08-11 by a dry run: **gpt-5 rejects temperature=0** and accepts
# only 1. SPEC §6.3 requires 0 for scoring, so as listed this candidate cannot
# satisfy the spec, and the bake-off will record it as a failed call rather than
# quietly scoring it at a different temperature. litellm's own message points at
# the fix — "for gpt-5.1, temperature is supported when reasoning_effort='none'"
# — so the OpenAI entry likely wants to change before the run. Left visible
# rather than silently swapped: which model represents OpenAI is a bake-off
# input, and MANUAL-TASKS §5 makes those Ricky's.
#
# Do NOT reach for `litellm.drop_params = True`. It would drop the temperature
# and let the run look successful while the determinism SPEC §6.3 asks for was
# never applied.
candidates:
  - provider: anthropic
    model: claude-sonnet-5
  - provider: openai
    model: gpt-5
  - provider: gemini
    model: gemini-3-pro

synthesis:
  provider: anthropic
  model: claude-sonnet-5
  temperature: 0.3
  # Call volume is low enough that cost is immaterial here; SPEC §7.2 says
  # prioritize quality.
  #
  # Drives the red-team section (SPEC §2.2⑤) and the AI 총평 (SPEC §2.2⑧).
  # 총평 output is checked by src/report/consistency.py before publication: any
  # rating label disagreeing with the computed rating in §2.2⑥ drops the section
  # and puts the reason in the report header. Note that temperature is 0.3 here,
  # not 0 — this output is prose and is deliberately outside the evaluation path
  # (PREREGISTRATION §8.4), unlike the scoring stage above.
