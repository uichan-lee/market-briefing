# Model selection. SPEC §7.1.
#
# CLAUDE.md: no vendor SDK is imported outside src/llm/adapter.py. Swapping a
# provider must be a change to the `provider` string here and nothing else.

embedding:
  provider: local
  model: BAAI/bge-m3          # KR/EN in one model, MIT, runs locally → zero cost

scoring:
  provider: openai            # anthropic | openai | google | naver | local
  model: gpt-5.4
  temperature: null
  batch: true
  # ── DECIDED 2026-08-12 (gpt-5.1), REVISED 2026-08-13 (gpt-5.4) — both by
  # Ricky, both on the SPEC §7.4 bake-off. The revision does not overturn the
  # original decision rule, MANUAL-TASKS §5: among candidates passing
  # golden-set correlation and self-consistency, take the lowest cost per
  # valid signal. What changed is what "cost" means once OpenAI's data-sharing
  # free-token program entered the comparison — see below.
  #
  # ── Round 1 (2026-08-12): gpt-5.1 over claude-sonnet-5 and gemini-3.5-flash ──
  #
  #   model              relevance  polarity  σ(pol)  compliance  $/signal
  #   claude-sonnet-5        0.83     0.87    0.036     99.4%     $0.0837
  #   gpt-5.1                0.76     0.82    0.033    100.0%     $0.0101
  #   gemini-3.5-flash       0.83     0.85      —      100.0%     $0.0116
  #   bar                   > 0.7    > 0.6   < 0.1      > 99%        —
  #
  # Both claude-sonnet-5 and gpt-5.1 cleared every bar; gpt-5.1 won on cost,
  # 8.3× cheaper (~$5/month vs ~$28, at ~140 pairs/day). sonnet-5's 0.07
  # relevance lead was real, not noise, and was not the basis for excluding
  # it — the rule selects on cost among passing candidates, not on rank.
  # gemini-3.5-flash failed on **σ unmeasured**, not price: its free tier's
  # 20-calls/day cap forced `--repeats 1`, so self-consistency was never
  # actually measured. It also emitted 502 output tokens against gpt-5.1's 78
  # for the same five-number schema — reasoning billed as output at $9/1M.
  #
  # ── Round 2 (2026-08-13): re-opened after Ricky read that OpenAI cut
  # gpt-5.6-luna's price 80%. Two things followed from actually checking, not
  # from that one headline: ──
  #
  # (a) The OpenAI side of the original bake-off was never a survey. gpt-5.1
  # was picked only because gpt-5 rejected `temperature=0` and 5.1 was the
  # smallest bump that accepted it — nobody then checked whether a newer
  # generation existed. By 2026-08-11 gpt-5.2, gpt-5.4, gpt-5.5 and gpt-5.6
  # all already shipped, unexamined.
  #
  # (b) Ricky's OpenAI dashboard (Data Controls → Sharing, read 2026-08-13)
  # gives daily complimentary tokens for sharing traffic — up to **250K
  # tokens/day** shared across {gpt-5.4, gpt-5.2, gpt-5.1, gpt-5, gpt-4.1,
  # gpt-4o, o1, o3, ...}, up to **2.5M/day** across the mini/nano tier of the
  # same generations. **None of gpt-5.6's tiers — sol, terra, or luna — are in
  # either list.** This inverts the earlier price comparison: a model sharing
  # gpt-5.1's free pool is not "dominated" by a cheaper-on-paper model that is
  # not in the program at all, because inside the free cap the sticker price is
  # moot for both.
  #
  # ⚠ **The sharing setting has not been confirmed on.** Ricky read the
  # eligibility list off the dashboard and agreed to enrol; whether the toggle
  # itself is on has not been checked since, and nothing in this repository can
  # check it — see the closing note below. This matters more than it looks:
  # on sticker price gpt-5.4 is **4.4× dearer** than gpt-5.1 ($0.0448 vs
  # $0.0101 per valid signal, $0.00421 vs $0.00120 per call over the stored
  # attempts), and MANUAL-TASKS §5's rule takes the cheapest passing candidate.
  # The whole case for 5.4 over 5.1 is that inside the free pool both cost $0,
  # so **if sharing is off, the rule selects gpt-5.1.** MANUAL-TASKS lists the
  # check as a waiting item; do not treat this decision as settled until it
  # comes back.
  #
  # Measured full-sample token use: gpt-5.1 averages 1,388 tokens/call
  # (1,310 in + 78 out, n=505), gpt-5.4 averages 1,374 (1,312 in + 62 out,
  # n=500) — almost identical. At ~140 pairs/day that's ~194K and ~192K
  # tokens/day respectively, **~77% of the shared 250K/day free cap** either
  # way — comfortable margin today, worth re-checking if ticker count or
  # article volume grows. Overflow beyond the cap bills at each model's own
  # rate ($1.25/$10 per 1M for 5.1, $2.50/$15 for 5.4) — 5.4 costs more only
  # on the marginal overflow, which at current volume is rare and small.
  #
  # Full re-run results (this round added gpt-5.4, gpt-5.6, gpt-5.6-luna,
  # gpt-5.6-terra, gpt-5-nano, gpt-5.4-nano — 3,195 calls total across 9
  # models, `data/bakeoff/attempts.jsonl`):
  #
  #   model              relevance  polarity  σ(pol)  compliance  $/signal  free-tier
  #   claude-sonnet-5        0.83     0.87    0.036     99.4%     $0.0837   no (Anthropic)
  #   gpt-5.1                0.76     0.82    0.033    100.0%     $0.0101   yes
  #   gpt-5.4                0.78     0.86    0.041    100.0%     $0.0448   yes
  #   gpt-5.6 (sol)           0.83     0.87    0.054    100.0%     $0.0577   no
  #   gpt-5.6-luna            0.82     0.85    0.088    100.0%     $0.0022   no
  #   gemini-3.5-flash       0.83     0.85      —      100.0%     $0.0116   n/a
  #   bar                   > 0.7    > 0.6   < 0.1      > 99%        —
  #
  # `gpt-5.4` beats `gpt-5.1` on relevance (0.78 vs 0.76), polarity (0.86 vs
  # 0.82), and **uncertainty** (0.55 vs 0.43 — real, well above that
  # dimension's ±0.03 noise floor), at effectively the same free-pool cost.
  # `gpt-5.6-luna` is the cheapest passer on sticker price ($0.0022) but is
  # not in the free program at all, so its real cost is *higher* than 5.4's
  # under current volume ($0 for 5.4 vs ~$1/month for luna) — the 80% price
  # cut that started this round of testing turned out not to be the actual
  # deciding factor. `gpt-5.6` (sol) passes but is neither free-tier eligible
  # nor cheaper than 5.4, so it has no case over it.
  #
  # ── Rejected, tested this round: ──
  #   gpt-5-nano    relevance 0.47 (bar 0.7) — fails outright. Also 17.4s/call
  #                 mean latency (vs 1-5s for every other candidate) — a
  #                 hidden-reasoning tax (confirmed via response `thinking`
  #                 content on the Anthropic side of this same investigation;
  #                 not directly inspectable on the OpenAI side, but the
  #                 latency and the $/token-vs-$/call mismatch match the
  #                 pattern). Would blow the report workflow's 30-minute
  #                 budget on its own before quality is even considered.
  #   gpt-5.4-nano  relevance 0.48, σ(pol) 0.113 (bar 0.1) — fails both.
  #                 Free-tier eligible and fast (0.95s/call) but not accurate
  #                 enough for this task regardless.
  #   gpt-5.6-terra Stopped by Ricky before its full run (10 dry-run calls
  #                 only, in `data/bakeoff/attempts.jsonl`) — priced between
  #                 luna and sol with no distinct role once luna is cheapest-
  #                 on-paper and sol is the quality-first alternative, and not
  #                 free-tier eligible either way.
  #
  # `uv run python -m src.eval.bakeoff report` regenerates this table from
  # stored attempts — no API calls, so re-reading the decision costs nothing.
  #
  # ── Not yet done, and it is what this whole decision rests on: confirming
  # the free-tier credit is actually enabled. It is an OpenAI account setting
  # (Data Controls → Sharing), not a code change — nothing in this repo reads,
  # depends on, or can verify it, which is exactly why it needs a human check
  # rather than a test. MANUAL-TASKS carries it as a waiting item; the ⚠ block
  # in the scoring comment above states what changes if it comes back off.
  #
  # Worth stating once, because it is the price of the free tokens: sharing
  # sends the scoring prompts — article title, description and ticker — to
  # OpenAI for training. Every one is public RSS text that was already
  # published, so nothing private leaves, but it is a real term of the trade
  # and the cost argument above should not be read as if it were free of one.
  #
  # If usage grows past the ~77% mark and starts
  # spilling into paid overflow regularly, revisit whether a same-day
  # cheaper-model fallback (e.g. gpt-5.6-luna) is worth the added routing
  # complexity — deferred because scoring is not wired into
  # `scripts/collect_daily.py` yet (SPEC §12 steps 6-8), so there is no
  # running system to attach that logic to today.

# The models the SPEC §7.4 bake-off compares. Read only by src/eval/bakeoff.py,
# never by the pipeline — these are alternatives under test, not the configured
# choice, which is why the runner overrides `scoring` rather than editing it.
#
# Three frontier models first, because §7.4 measures structured-output maturity
# and these are the ones where it is reliable enough that the comparison
# reflects the models rather than three different JSON failure modes. SPEC §7.2
# says not to exclude the Korean models — HyperCLOVA X's tokenizer is cheaper on
# Korean text — and they are the intended fourth candidate, added once this
# harness has been shown to work end to end against a real vendor.
#
# `uv run python -m src.eval.bakeoff run` needs a key per provider. See
# API-KEYS.md §8.
#
# ── Candidates chosen 2026-08-11 by Ricky, after probing all three live APIs ──
# The first list — `gpt-5` and `gemini-3-pro` — was replaced because neither
# could run, for two unrelated reasons. Both are recorded here so the next
# person does not rediscover them by spending money.
#
#   gpt-5 rejects temperature=0 and accepts only 1. litellm blocks this
#   client-side, before the network. gpt-5.1 passes the same check and takes 0,
#   so the substitution is what unblocks the run rather than a preference.
#
#   gemini-3-pro does not exist as a text model. The key's own ListModels
#   returns 36 models supporting generateContent and none is `gemini-3-pro`;
#   the near-match, `gemini-3-pro-image`, is an image model. `gemini-2.5-pro`
#   answers 404, "no longer available to new users", and `gemini-3.1-pro-preview`
#   answers 429 — the pro tier needs billing enabled. `gemini-3.5-flash` works
#   at temperature 0 on the free tier and is what is listed.
#
# Verified 2026-08-11 with live structured calls, all three answering:
#   claude-sonnet-5   OK — but only with **no** temperature. See below.
#   gpt-5.1           OK at temperature 0, once credit was added.
#   gemini-3.5-flash  OK at temperature 0.
#
# ⚠ **The frontier is removing the temperature knob.** SPEC §6.3 asked for 0
# outright until 2026-08-11; it now asks for the most deterministic setting each
# vendor still offers, and for the value sent to be recorded, because a single
# number cannot be sent to all three. Asked directly, each vendor says:
#   claude-sonnet-5   `400: `temperature` is deprecated for this model`. Omitted
#                     or 1 are the only options; 0 and 0.0 are both refused.
#   gpt-5             only 1. gpt-5.1 accepts 0, which is why 5.1 is listed.
#   gemini-3.5-flash  accepts 0, but litellm warns Gemini 3+ has `temperature`
#                     slated for removal, with sampling guidance moving into the
#                     system prompt.
# So the candidates cannot share one temperature. The bake-off refuses to hide
# that: each call records the temperature it was sent, the report prints the
# column, and it says plainly that rows differing there were not run under the
# same conditions. Where temperature can no longer be pinned, §7.4's
# self-consistency σ across the 5 repeats becomes the *only* measurement of
# determinism — which is an argument for keeping the repeats, not dropping them,
# and is what PREREGISTRATION §8.3 now names as the instrument for "LLM output
# reproducibility".
#
# ⚠ Gemini's free tier is **5 RPM and 20 RPD** on `gemini-3.5-flash` — read off
# Google AI Studio's own dashboard (aistudio.google.com/rate-limit) 2026-08-12,
# and confirmed by the 429 body, which names `quotaValue: 20` for
# `GenerateRequestsPerDayPerProjectPerModel-FreeTier`.
#
# The earlier note here said "roughly 9 calls/min … per-minute, not per-day",
# inferred by probing the API rather than by reading the quota. Both halves were
# wrong, and the second was the expensive one: it is the daily cap that stopped
# the 500-call run, and no amount of pacing or backoff clears it. RPD resets at
# **midnight Pacific**, not on a rolling 24h window — a batch run late in the KST
# afternoon is already spending the next Pacific day's budget, which is what made
# an apparently-fresh run fail on its 4th call.
#
# `src/eval/bakeoff.py` paces Google at 5 calls/min. If a 429 survives every
# backoff the runner abandons that candidate and says so, because that is the
# signature of the per-day cap. Enabling billing removes both limits: with it on,
# 97 calls ran back to back with zero failures.
#
# Do NOT reach for `litellm.drop_params = True`. It would drop the temperature
# and let the run look successful while the determinism SPEC §6.3 asks for was
# never applied.
#
# Cost, measured not guessed: the rendered scoring prompt averages 1,532 input
# tokens over the 100 golden examples, so one candidate's 500 calls (100 × 5
# repeats) is ≈ $2.3 on sonnet-5, $1.7 on gpt-5.1, $1.8 on gemini-3.5-flash. A
# full three-model bake-off is ≈ $6, not the "under $1" written before it was
# measured.
#
# `temperature` below overrides the `scoring` stage per candidate, and an
# explicit `null` means "send no temperature at all" rather than "send zero".
# It exists because temperature 0 is no longer a setting every frontier model
# has — see the ⚠ block above. The bake-off writes whatever was
# actually sent onto every call and prints it as a column, so a comparison
# across differing temperatures cannot be read without noticing.
candidates:
  - provider: anthropic
    model: claude-sonnet-5
    temperature: null       # Anthropic: 400, "`temperature` is deprecated for this model"
  - provider: gemini
    model: gemini-3.5-flash
    temperature: 0          # verified live 2026-08-11; deprecation warned

  # gpt-5.1: the original (2026-08-12) winner, kept live as the reference
  # point the scoring decision above compares everything against. gpt-5.4
  # superseded it 2026-08-13 — see that comment for the full account,
  # including why the OpenAI side needed a second look at all (gpt-5.2/5.4/
  # 5.5/5.6 all shipped before the original bake-off and none were checked),
  # and the free-tier-eligibility finding that decided it.
  - provider: openai
    model: gpt-5.1
    temperature: 0          # verified live 2026-08-11
  - provider: openai
    model: gpt-5.4
    temperature: null       # verified live 2026-08-13: rejects 0, default only

  # gpt-5.6's sol/luna: both pass §7.4's bars (scoring comment above has the
  # full table) but neither is in OpenAI's free-tier program the way 5.1/5.4
  # are, so both cost more in practice despite sol/luna's sticker price
  # looking competitive or cheaper. Kept live as the fallback pair if a
  # future re-check finds 5.4 no longer wins: luna on raw price, sol on
  # quality headroom over the whole gpt-5.x line tested so far.
  - provider: openai
    model: gpt-5.6-luna
    temperature: null       # verified live 2026-08-13: rejects 0, default only
  - provider: openai
    model: gpt-5.6
    temperature: null       # verified live 2026-08-13: rejects 0, default only

  # ── Tested 2026-08-13 and NOT kept live — re-adding costs money to
  # re-confirm a result already on record in `data/bakeoff/attempts.jsonl`.
  # Full numbers are in the scoring comment above.
  #
  #   gpt-5-nano     relevance 0.47 (bar 0.7) — fails. Also 17.4s/call mean
  #                  latency, ~10x every other candidate — a hidden-reasoning
  #                  cost that would threaten the report workflow's own
  #                  30-minute budget on its own, separately from accuracy.
  #   gpt-5.4-nano   relevance 0.48, σ(pol) 0.113 (bars 0.7 / 0.1) — fails
  #                  both, despite being fast and free-tier eligible.
  #   gpt-5.6-terra  Never finished a full run — Ricky stopped it after 10
  #                  dry-run calls once luna (cheapest) and sol (quality
  #                  fallback) covered the range terra would have sat in.
  #
  # If re-testing any of these, `uv run python -m src.eval.bakeoff run
  # --model <name> --limit 5 --repeats 1` first — gpt-5-nano and gpt-5.4-nano
  # both need `temperature: null` (0 was never tried for either; null worked
  # on the first attempt), matching the pattern every gpt-5.x-and-later
  # OpenAI model has shown so far.

synthesis:
  provider: anthropic
  model: claude-sonnet-5
  temperature: 0.3
  # Call volume is low enough that cost is immaterial here; SPEC §7.2 says
  # prioritize quality.
  #
  # Drives the red-team section (SPEC §2.2⑤) and the AI 총평 (SPEC §2.2⑧).
  # 총평 output is checked by src/report/consistency.py before publication: any
  # rating label disagreeing with the computed rating in §2.2⑥ drops the section
  # and puts the reason in the report header. Note that temperature is 0.3 here,
  # not 0 — this output is prose and is deliberately outside the evaluation path
  # (PREREGISTRATION §8.4), unlike the scoring stage above.
