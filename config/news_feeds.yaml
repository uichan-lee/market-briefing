# Korean news RSS feeds. SPEC §3.1.
#
# Feeds are configuration, not code — the same reason delivery channels live in
# config/delivery.yaml. Adding an outlet is an edit here, not a code change.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY RSS AND NOT THE NAVER SEARCH API
#
# The Naver search API closed to new registrations in 2026: 검색 moved to NAVER
# Cloud Platform's API HUB, which takes a payment method at signup and is free
# only 한시적으로. GDELT was measured as a replacement and rejected — it carries
# none of the 21 Korean financial outlets checked. Details in API-KEYS.md §2.
#
# RSS is a subscription, not a query: each outlet publishes its most recent
# 50–120 articles and we take all of them, filtering locally. That means
# coverage equals this list — an outlet absent here is invisible to the
# pipeline. It also means there is no result cap and no ranking algorithm
# between us and what the outlet actually published.
# ─────────────────────────────────────────────────────────────────────────────
#
# `domain` is not decoration. The collector checks that each item's link
# actually points there, which catches a feed that has been redirected or
# replaced with someone else's content — the well-formed-but-wrong failure that
# a schema check sails straight past.
#
# Measured 2026-08-03. `description` length varies enormously by outlet and is
# recorded here because it decides how much text SPEC §6.2 has to score:
# 뉴시스 ~1155자, 머니투데이 ~516자, 인포스탁 ~300자, 전자신문 ~250자,
# 아시아경제 ~236자, 매일경제 ~102자, 연합뉴스 ~83자, 한국경제·조선비즈 0자.
#
# Headline-only outlets are kept deliberately. Korean media re-report heavily,
# so SPEC §6.1's clustering will group a 한국경제 headline with a 뉴시스 item
# carrying the full body, and the cluster representative can be the latter.

feeds:
  - name: hankyung_finance
    outlet: 한국경제
    section: 증권
    url: https://www.hankyung.com/feed/finance
    domain: hankyung.com
    enabled: true

  - name: hankyung_economy
    outlet: 한국경제
    section: 경제
    url: https://www.hankyung.com/feed/economy
    domain: hankyung.com
    enabled: true

  - name: hankyung_it
    outlet: 한국경제
    section: IT
    url: https://www.hankyung.com/feed/it
    domain: hankyung.com
    enabled: true

  - name: mk_stock
    outlet: 매일경제
    section: 증권
    url: https://www.mk.co.kr/rss/50200011/
    domain: mk.co.kr
    enabled: true

  - name: mk_company
    outlet: 매일경제
    section: 기업
    url: https://www.mk.co.kr/rss/50100032/
    domain: mk.co.kr
    enabled: true

  - name: mk_economy
    outlet: 매일경제
    section: 경제
    url: https://www.mk.co.kr/rss/30100041/
    domain: mk.co.kr
    enabled: true

  - name: yna_economy
    outlet: 연합뉴스
    section: 경제
    url: https://www.yna.co.kr/rss/economy.xml
    domain: yna.co.kr
    enabled: true

  - name: yna_industry
    outlet: 연합뉴스
    section: 산업
    url: https://www.yna.co.kr/rss/industry.xml
    domain: yna.co.kr
    enabled: true

  - name: etnews_main
    outlet: 전자신문
    section: 주요
    url: https://rss.etnews.com/Section901.xml
    domain: etnews.com
    enabled: true

  # Section902 was removed on 2026-08-07. It was declared `section: 경제` and was
  # not one — the feed's own title is 속보, and it ran everything: a school
  # shooting in Thailand and a musical's teaser poster sat between two earnings
  # releases. Same failure as the site-wide 조선비즈 feed below, found the same
  # way.
  #
  # It was also the single worst thing in the collector, and the numbers are
  # worth keeping because they were expensive to get:
  #
  #   - Watchlist match rate 4.0% (224 articles, 9 matched) against a 7.0%
  #     corpus average and 9.4% for Section901. About 3.6 useful articles a day.
  #   - Thirty items spanning 1.2 hours — by far the fastest-rolling feed, and
  #     the only reason MAX_COLLECTION_GAP's two hours was above a real buffer.
  #     Without it the fastest is yna_industry at 6.5h.
  #   - 11 of its 30 items were already arriving via Section901.
  #   - Every observed news loss came from this feed. It is the only feed ever
  #     named in a `feed_continuity` failure, including the 13.6h lost overnight
  #     on 2026-08-07 when GitHub dropped eight consecutive scheduled runs.
  #
  # Adding a third 전자신문 feed was considered as a safety net and measured
  # instead: every etnews hostname resolves to 112.175.235.196, so the outages
  # are host-level and all its feeds black out together — the two always failed
  # in the same runs, ten of thirty. Of the only other two RSS URLs the site
  # offers, Section904 was byte-identical to Section901 (30 of 30 links) and
  # Section903 shared zero links with either and lagged eight hours. There is no
  # redundancy to buy inside etnews.
  #
  # Section901 stays: 9.4% match rate, and its 7.9h buffer means a failed run is
  # recovered by the next one rather than lost.

  # Replaced the site-wide 조선비즈 feed on 2026-08-05. That one was declared
  # `section: 전체` and lived up to it: of 100 items, 36 were the Japanese
  # edition of articles already arriving in Korean, and the rest carried the
  # sports desk. It alone produced 220 of the 281 sport articles in the corpus —
  # 27% of everything it sent — against 0–12% for every other feed.
  #
  # The section feeds carry more and cleaner: stock + industry is 164 items with
  # no sport and no Japanese, against 100 items for 전체. Measured directly.
  #
  # `finance` and `it` exist as URLs but return zero items, so they are not
  # listed; re-check before adding them.
  - name: chosunbiz_stock
    outlet: 조선비즈
    section: 증권
    url: https://biz.chosun.com/arc/outboundfeeds/rss/category/stock/?outputType=xml
    domain: chosun.com
    enabled: true

  - name: chosunbiz_industry
    outlet: 조선비즈
    section: 산업
    url: https://biz.chosun.com/arc/outboundfeeds/rss/category/industry/?outputType=xml
    domain: chosun.com
    enabled: true

  - name: mt_news
    outlet: 머니투데이
    section: 전체
    url: https://rss.mt.co.kr/mt_news.xml
    domain: mt.co.kr
    # DISABLED — blocked from GitHub Actions runners, not broken.
    # Measured 2026-08-03: answers in 0.1s from a Korean connection, times out
    # on all three attempts from a runner. Cloud-IP or geo blocking.
    #
    # A painful one to lose: ~516자 of body text, among the most useful sources
    # for SPEC §6.2 scoring. Left disabled rather than enabled-and-failing
    # because a fetch check that fails every single hour is one that stops being
    # read, and then a real failure goes unnoticed.
    #
    # Recoverable if collection ever moves to a Korean IP, or if a mirror URL
    # that answers from cloud hosts is found.
    enabled: false

  - name: asiae_stock
    outlet: 아시아경제
    section: 증권
    url: https://www.asiae.co.kr/rss/stock.htm
    domain: asiae.co.kr
    enabled: true

  - name: newsis_economy
    outlet: 뉴시스
    section: 경제
    url: https://newsis.com/RSS/economy.xml
    domain: newsis.com
    enabled: true

  - name: infostock_all
    outlet: 인포스탁데일리
    section: 전체
    url: https://www.infostockdaily.co.kr/rss/allArticle.xml
    domain: infostockdaily.co.kr
    # This feed emits a naive "2026-08-03 17:11:18" with no zone. A Korean
    # outlet means KST, but the parser refuses to infer that: reading it as UTC
    # would place every article 9 hours early and make it appear knowable before
    # publication — the look-ahead failure CLAUDE.md forbids. Declared here so
    # the assumption is reviewable rather than buried in the parser.
    timezone: Asia/Seoul
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Tried and failed on 2026-08-03. Recorded so nobody re-tests them from scratch;
# each needs a working replacement URL found before it can be enabled.
#
#   서울경제      https://www.sedaily.com/RSS/S1N1.xml            HTTP 404
#   파이낸셜뉴스  https://www.fnnews.com/rss/r_finance.xml        HTTP 404
#   이데일리      https://rss.edaily.co.kr/stock_news.xml         connection reset
#   더벨          https://www.thebell.co.kr/free/content/rss.asp  malformed XML
#
# 이데일리 and 서울경제 are worth the effort to recover — both carry heavy
# equity coverage. 더벨 is IB/deal focused and lower priority.
# ─────────────────────────────────────────────────────────────────────────────
