#
# Two tools carry the mechanical half. Neither writes this file:
#
#   uv run python scripts/config_helper.py scaffold
#       → config/aliases.draft.yaml, with canonical/exclude/ambiguous_parents
#         pre-filled per watchlist ticker and `aliases` left empty. Copy from it.
#
#   uv run python scripts/config_helper.py audit --samples 5
#       → per-alias hit counts against the news already collected, plus sample
#         headlines. This is how a bad alias gets caught; "SEC" above was.
