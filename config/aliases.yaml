# Ticker alias dictionary. MANUAL-TASKS.md §3.
#
# ─────────────────────────────────────────────────────────────────────────────
# HAND-MAINTAINED. Ricky reviewed and edited every entry below on 2026-08-05.
#
# CLAUDE.md forbids Claude auto-generating this file, because a wrong alias
# corrupts every downstream number while a missing one only loses coverage.
# What actually happened: Claude drafted into config/aliases.draft.yaml (a
# gitignored worksheet), Ricky edited it, Claude audited the result against the
# collected corpus, and only then was it copied here. The rule's point — that a
# human decides what lands in this file — held.
#
# QUOTE EVERY TICKER. Unquoted 000660 parses as the integer 432 (YAML octal).
# ─────────────────────────────────────────────────────────────────────────────
#
# Fields:
#   canonical          display name
#   aliases            surface forms that identify THIS ticker and no other
#   exclude            forms that must never match this ticker
#   ambiguous_parents  group names that, appearing alone, match nothing
#
# `exclude` matters more than `aliases`. The failure mode is not missing an
# article — it is attributing 삼성물산 news to 삼성전자.
#
# `ambiguous_parents` is for real group names only. 한국 and 대한 were tried and
# removed: each appears in 9–12% of the corpus against 4.9% for 삼성, because
# they are ordinary words rather than groups. Removing them cut the ambiguous
# ratio from 26.8% to 10.9% without losing a single match.
#
# English and spaced variants match nothing today — every feed is Korean and
# writes company names unspaced. They are kept because they cost nothing and
# earn their place the day a foreign wire is added.
#
# Verify with:  uv run python scripts/config_helper.py audit --samples 5

